name: Public-beta feedback
description: Share sanitized usability and workflow feedback from a Harako-RNAseq beta run.
title: "[Beta feedback]: "
labels:
  - beta-feedback
body:
  - type: markdown
    attributes:
      value: |
        Do not upload FASTQ files, patient data, credentials, identifiable sample names, confidential reports, or unsanitized logs.
  - type: dropdown
    id: platform
    attributes:
      label: OS and platform
      options:
        - Windows with Docker Desktop
        - Ubuntu/Linux with Docker
        - macOS (not yet verified)
        - Other
    validations:
      required: true
  - type: input
    id: docker_version
    attributes:
      label: Docker version
      placeholder: Output of docker version without private registry details
    validations:
      required: true
  - type: dropdown
    id: input_type
    attributes:
      label: Input type
      options:
        - Local FASTQ
        - SRA/ENA accession
        - Run Selector table
        - Other
    validations:
      required: true
  - type: dropdown
    id: read_layout
    attributes:
      label: Read layout
      options:
        - Single-end
        - Paired-end
        - Mixed or unknown
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Species and reference
      placeholder: Human Ensembl 113 GRCh38, or sanitized custom-reference description
    validations:
      required: true
  - type: input
    id: scale
    attributes:
      label: Approximate sample count and data size
      placeholder: 8 samples, approximately 40 GB total
  - type: dropdown
    id: report_completed
    attributes:
      label: Did the self-contained report complete?
      options:
        - "Yes"
        - "No"
        - Not attempted
    validations:
      required: true
  - type: input
    id: failed_step
    attributes:
      label: Failed step
      placeholder: Leave blank if the run completed
  - type: input
    id: elapsed
    attributes:
      label: Approximate elapsed time
  - type: input
    id: disk
    attributes:
      label: Peak disk use, if known
  - type: dropdown
    id: usability
    attributes:
      label: Overall usability
      options:
        - 5 - Very clear
        - 4
        - 3
        - 2
        - 1 - Could not proceed
    validations:
      required: true
  - type: dropdown
    id: documentation
    attributes:
      label: Was the documentation sufficient?
      options:
        - "Yes"
        - Partly
        - "No"
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: Describe the workflow, confusing steps, and expected improvements without sensitive data.
    validations:
      required: true
  - type: dropdown
    id: support_bundle
    attributes:
      label: Sanitized support bundle available?
      options:
        - "Yes"
        - "No"
        - Not sure
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy acknowledgement
      options:
        - label: I have not included FASTQ data, patient information, credentials, identifiable sample names, or confidential reports.
          required: true
