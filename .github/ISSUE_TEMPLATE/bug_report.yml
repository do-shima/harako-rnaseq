name: Bug report
description: Report a reproducible Harako-RNAseq failure
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove sensitive identifiers from all examples and logs. Do not upload FASTQ files or confidential data.
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Include the OS name and version.
      placeholder: Windows 11, Ubuntu 24.04, or macOS 15
    validations:
      required: true
  - type: input
    id: docker_version
    attributes:
      label: Docker version
      placeholder: Output of docker version
    validations:
      required: true
  - type: input
    id: harako_version
    attributes:
      label: Harako-RNAseq version
      description: Provide a release version or Git commit.
      placeholder: v0.3.0-beta.2 or commit SHA
    validations:
      required: true
  - type: textarea
    id: launch_command
    attributes:
      label: Launch command
      description: Remove credentials, tokens, and private paths.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: pipeline_stage
    attributes:
      label: Pipeline stage
      options:
        - Application launch
        - Input validation
        - Reference preparation
        - Preprocessing
        - Quantification
        - Differential expression
        - Enrichment
        - Report generation
        - Resume or recovery
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a minimal reproduction and sanitized error output.
    validations:
      required: true
  - type: dropdown
    id: support_bundle
    attributes:
      label: Sanitized support bundle
      description: Is a support bundle or sanitized log set available?
      options:
        - "Yes"
        - "No"
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: sample_table
    attributes:
      label: Sanitized sample table structure
      description: Show column names and representative synthetic rows without sensitive identifiers.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Data privacy acknowledgement
      options:
        - label: I have not uploaded FASTQ files, confidential data, credentials, or sensitive sample identifiers.
          required: true
