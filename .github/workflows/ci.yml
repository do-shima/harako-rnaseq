name: ci

on:
  push:
  pull_request:

jobs:
  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just
      - name: Build image
        run: docker build -t rnaseq_pipeline:dev .
      - name: tximport mismatch test
        run: just test-tximport
      - name: tximport rat header test
        run: just test-tximport-rat-header
      - name: enrichment fixture test
        run: just test-enrichment
      - name: Snakemake dry-run (rule listing)
        run: just list-rules
      - name: UI syntax check
        run: python -m py_compile app/ui/app_ui.py
      - name: Launcher import check
        run: python -c "import tools.launcher.rnaseq_launcher"
